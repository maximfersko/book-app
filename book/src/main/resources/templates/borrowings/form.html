<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <h5 class="mb-3">Borrow a Book</h5>
    <div class="card p-4" style="max-width: 440px">
        <div class="alert alert-success py-2 small" th:if="${param.success}">Book borrowed successfully!</div>
        <form th:action="@{/borrowings}" th:object="${borrowing}" method="post">
            <div class="mb-3">
                <label class="form-label">Client</label>
                <select class="form-select" th:field="*{clientId}">
                    <option value="">— Select client —</option>
                    <option th:each="client : ${clients}"
                            th:value="${client.id}"
                            th:text="${client.fullName}"></option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('clientId')}" th:errors="*{clientId}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Book</label>
                <select class="form-select" th:field="*{bookId}">
                    <option value="">— Select book —</option>
                    <option th:each="book : ${books}"
                            th:value="${book.id}"
                            th:text="${book.title + ' — ' + book.author}"></option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('bookId')}" th:errors="*{bookId}"></div>
            </div>
            <button type="submit" class="btn btn-dark btn-sm">Borrow</button>
        </form>
    </div>
</div>
</body>
</html>
