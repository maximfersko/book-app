<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Books</h5>
        <a th:href="@{/books/new}" class="btn btn-dark btn-sm">+ Add Book</a>
    </div>
    <div class="card">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>ISBN</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="book : ${page.content}">
                    <td th:text="${book.title}"></td>
                    <td th:text="${book.author}"></td>
                    <td th:text="${book.isbn}"></td>
                    <td class="text-end">
                        <a th:href="@{/books/{id}/edit(id=${book.id})}" class="btn btn-outline-secondary btn-sm">Edit</a>
                        <form th:action="@{/books/{id}/delete(id=${book.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-outline-danger btn-sm"
                                    onclick="return confirm('Delete this book?')">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div th:if="${page.totalPages > 1}" class="d-flex justify-content-center mt-3">
        <nav>
            <ul class="pagination pagination-sm">
                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/books(page=${page.number - 1})}">‹</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                    th:classappend="${i == page.number} ? 'active'">
                    <a class="page-link" th:href="@{/books(page=${i})}" th:text="${i + 1}"></a>
                </li>
                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/books(page=${page.number + 1})}">›</a>
                </li>
            </ul>
        </nav>
    </div>
</div>
</body>
</html>
