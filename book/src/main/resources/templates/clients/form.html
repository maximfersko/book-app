<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<body>
<div layout:fragment="content">
    <h5 class="mb-3" th:text="${client.id} ? 'Edit Client' : 'Add Client'"></h5>
    <div class="card p-4" style="max-width: 440px">
        <form th:action="${client.id} ? @{/clients/{id}(id=${client.id})} : @{/clients}"
              th:object="${client}" method="post">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" th:field="*{fullName}" placeholder="Ivan Ivanov"/>
                <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Birth Date</label>
                <input type="date" class="form-control" th:field="*{birthDate}"/>
                <div class="text-danger small" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-dark btn-sm">Save</button>
                <a th:href="@{/clients}" class="btn btn-outline-secondary btn-sm">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
